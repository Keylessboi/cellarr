[package]
name = "cellarr-plugins"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
wasm = ["dep:wasmtime", "dep:wit-component", "dep:wasmparser", "dep:reqwest", "dep:tokio", "dep:async-trait", "dep:tracing"]
# The bridge to a Lidarr sidecar hosting native Lidarr plugins.
sidecar = ["dep:reqwest", "dep:tokio", "dep:async-trait", "dep:tracing", "dep:time"]

[dependencies]
cellarr-core.workspace = true
wasmtime = { workspace = true, optional = true }
wit-component = { version = "0.251", optional = true }
wasmparser = { version = "0.251", optional = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"], optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
time = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time"] }
